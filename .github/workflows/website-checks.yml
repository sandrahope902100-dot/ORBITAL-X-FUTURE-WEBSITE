name: Website release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check JavaScript syntax
        run: |
          node --check assets/script.js
          node --check assets/directory.js
          node --check admin/app.js

      - name: Check required directory controls and launch gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text()
          directory = Path("assets/directory.js").read_text()
          admin = Path("admin/app.js").read_text()
          setup = Path("admin/setup.sql").read_text()
          verify = Path("admin/verify.sql").read_text()

          required_html = [
              'id="directoryFilterForm"',
              'id="directorySearch"',
              'id="directoryCategory"',
              'id="directoryLocation"',
              'id="directoryLoadMore"',
              'id="businessApplicationForm"',
              'id="publicListings"',
          ]
          missing = [item for item in required_html if item not in html]
          if missing:
              raise SystemExit(f"Missing required website controls: {missing}")

          required_directory = [
              'const APPLICATIONS_OPEN=false',
              'directory_portal_ready',
              'search_business_directory',
              'directory_reports',
              'listing-report-form',
          ]
          missing = [item for item in required_directory if item not in directory]
          if missing:
              raise SystemExit(f"Missing required directory safeguards: {missing}")

          required_admin = [
              'verifyFounder',
              'review_business_submission',
              'setPublication',
              'renewListing',
              'loadReports',
              'updateReport',
          ]
          missing = [item for item in required_admin if item not in admin]
          if missing:
              raise SystemExit(f"Missing required founder controls: {missing}")

          required_sql = [
              "create table if not exists public.directory_reports",
              "Anyone can submit directory reports",
              "Founder can read directory reports",
              "Founder can update directory reports",
              "limit_directory_reports",
              "validate_directory_report",
              "directory_report_rate_limit",
              "validate_directory_report_before_insert",
          ]
          missing = [item for item in required_sql if item not in setup]
          if missing:
              raise SystemExit(f"Missing report database safeguards: {missing}")

          required_verify = [
              "reports_rls_enabled",
              "anon_can_read_reports",
              "report_rate_limit_trigger_exists",
              "report_target_validation_trigger_exists",
          ]
          missing = [item for item in required_verify if item not in verify]
          if missing:
              raise SystemExit(f"Missing report verification checks: {missing}")

          print("Required website controls and closed launch gate verified.")
          PY

      - name: Check browser code for server credentials
        run: |
          if grep -R -E 'sb_secret_|service_role|sk_live_|AIza[0-9A-Za-z_-]{20,}' assets admin --include='*.js' --include='*.html'; then
            echo "Potential server credential found in browser code."
            exit 1
          fi
          echo "No known server credential patterns found in browser code."
